version: "3.9"

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "fitness_db"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U を指定しないと、コンテナ内の実行ユーザー(root等)で接続しようとして
      # "role root does not exist" が出続けるので明示指定する
      test: ["CMD-SHELL", "pg_isready -U user -d fitness_db -h localhost -p 5432"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: fitness_db
      DB_USER: user
      DB_PASSWORD: password
      NODE_ENV: development
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: ["npm", "start"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  fitness_app_frontend:
    build:
      context: ./fitness_app
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  backend_node_modules:
